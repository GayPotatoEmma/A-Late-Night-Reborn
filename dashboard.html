<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0b22" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard | A Late Night Reborn</title>
    <link rel="icon" href="assets/alnr%20logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Quicksand:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" />
    <link rel="stylesheet" href="css/style.css?v=7" />
    <link rel="stylesheet" href="css/dreamscape.css?v=9" />
    <link rel="stylesheet" href="css/signups.css?v=11" />
    <link rel="stylesheet" href="css/dreamscape-signups.css?v=9" />
    <script>try{var _t=localStorage.getItem('alnr-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);if(localStorage.getItem('alnr-ui')==='refresh')document.documentElement.setAttribute('data-ui','refresh');}catch(e){}if(window.location.protocol!=='file:'&&location.pathname.endsWith('.html')){var _c=location.pathname.replace(/\/index\.html$/,'/').replace(/\.html$/,'');history.replaceState(null,'',_c+location.search+location.hash);}</script>
</head>
<body>

    <canvas id="stars-canvas"></canvas>
    <div class="bg-nebula"></div>

    <div class="site-wrapper">

        <!-- ── Header ── -->
        <header class="site-header">
            <div class="header-inner">
                <a href="/" class="header-logo-link">
                    <img src="assets/alnr%20logo.png" alt="ALNR Logo" class="header-logo" width="1024" height="1024" />
                </a>
                <a href="/">
                    <span class="header-site-name">A Late Night Reborn</span>
                </a>
                <a href="https://discord.gg/alnr" target="_blank" rel="noopener" class="header-discord">Discord</a>

                <button class="theme-toggle" id="theme-toggle" aria-label="Theme options">&#9728;</button>
                <button class="nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-expanded="false">&#9776;</button>
            </div>
        </header>

        <!-- ── Main ── -->
        <main class="main-content">
            <div class="signups-container" id="alnr-dashboard-root">
                <div class="glass-card alnr-skel-card alnr-skel-dash" aria-busy="true" aria-label="Loading host dashboard">
                    <span class="alnr-skel-line is-title" style="max-width: 240px;"></span>
                    <div class="alnr-skel-dash-grid">
                        <div class="alnr-skel-card alnr-skel-run">
                            <span class="alnr-skel-line is-pill"></span>
                            <span class="alnr-skel-line is-title"></span>
                            <span class="alnr-skel-line is-med"></span>
                        </div>
                        <div class="alnr-skel-card alnr-skel-run">
                            <span class="alnr-skel-line is-pill"></span>
                            <span class="alnr-skel-line is-title"></span>
                            <span class="alnr-skel-line is-med"></span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- ── Footer ── -->
        <footer class="site-footer">
          <div class="footer-inner">
            <a href="/" class="footer-brand">
              <img src="assets/alnr%20logo.png" alt="" class="footer-logo" width="22" height="22" loading="lazy" />
              <span>A Late Night Reborn</span>
            </a>
            <nav class="footer-links" aria-label="Footer">
              <a href="https://discord.gg/alnr" target="_blank" rel="noopener">Discord</a>
              <a href="/contact">Contact</a>
              <a href="/privacy">Privacy</a>
              <a href="https://ko-fi.com/gaypotatoemma" target="_blank" rel="noopener">Ko-fi</a>
            </nav>
          </div>
        </footer>

    </div>

    <script src="js/config.js?v=1" defer></script>
    <script src="js/theme.js?v=5" defer></script>
    <script src="js/stars.js?v=2" defer></script>
    <script src="js/nav.js?v=9" defer></script>
    <script src="js/dreamscape.js?v=7" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var apiUrl = (window.ALNR_CONFIG && window.ALNR_CONFIG.API_URL) || 'https://api.alatenightreborn.com';
            fetch(apiUrl + '/api/mod/lite-dashboard?t=' + Date.now(), {
                credentials: 'include',
                cache: 'no-store'
            })
                .then(function (r) {
                    if (!r.ok) {
                        window.location.replace('signups.html');
                        return '';
                    }
                    return r.text();
                })
                .then(function (code) {
                    if (code) {
                        var s = document.createElement('script');
                        s.textContent = code;
                        document.body.appendChild(s);
                    }
                })
                .catch(function () {
                    window.location.replace('signups.html');
                });
        });
    </script>
</body>
</html>
