<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard | A Late Night Reborn</title>
    <link rel="icon" href="assets/alnr%20logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Quicksand:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/signups.css" />
    <script>try{var _t=localStorage.getItem('alnr-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}if(window.location.protocol!=='file:'&&location.pathname.endsWith('.html')){var _c=location.pathname.replace(/\/index\.html$/,'/').replace(/\.html$/,'');history.replaceState(null,'',_c+location.search+location.hash);}</script>
</head>
<body>

    <canvas id="stars-canvas"></canvas>
    <div class="bg-nebula"></div>

    <div class="site-wrapper">

        <!-- ── Header ── -->
        <header class="site-header">
            <div class="header-inner">
                <a href="/" class="header-logo-link">
                    <img src="assets/alnr%20logo.png" alt="ALNR Logo" class="header-logo" width="1024" height="1024" />
                </a>
                <a href="/">
                    <span class="header-site-name">A Late Night Reborn</span>
                </a>
                <a href="https://discord.gg/alnr" target="_blank" rel="noopener" class="header-discord">Discord</a>

                <button class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode">&#9728;</button>
                <button class="nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-expanded="false">&#9776;</button>
            </div>
        </header>

        <!-- ── Main ── -->
        <main class="main-content">
            <div class="signups-container" id="alnr-dashboard-root">
                <div class="glass-card" style="text-align: center; padding: 2.5rem; color: var(--text-muted);">
                    Verifying session...
                </div>
            </div>
        </main>

        <!-- ── Footer ── -->
        <footer class="site-footer">
            <p>A Late Night Reborn &middot; Final Fantasy XIV Raid Guide &middot; <a href="privacy.html" class="footer-privacy-link">Privacy Notice</a> &middot; <a href="contact.html" class="footer-privacy-link">Contact</a></p>
        </footer>

    </div>

    <script src="js/theme.js"></script>
    <script src="js/stars.js"></script>
    <script src="js/nav.js"></script>
    <script>
        (function () {
            fetch('https://api.alatenightreborn.com/api/mod/lite-dashboard?t=' + Date.now(), {
                credentials: 'include',
                cache: 'no-store'
            })
                .then(function (r) {
                    if (!r.ok) {
                        window.location.replace('signups.html');
                        return '';
                    }
                    return r.text();
                })
                .then(function (code) {
                    if (code) {
                        var s = document.createElement('script');
                        s.textContent = code;
                        document.body.appendChild(s);
                    }
                })
                .catch(function () {
                    window.location.replace('signups.html');
                });
        })();
    </script>
</body>
</html>
